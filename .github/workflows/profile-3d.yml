name: 3D contributions

on:
  schedule:
    - cron: "17 21 * * *"   # every night, 00:17 Moscow time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "config/profile-3d.json"
      - "scripts/recolor_pie.py"

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/profile-3d.json

      - name: Recolor language chart
        run: |
          python3 scripts/recolor_pie.py \
            profile-3d-contrib/pantihen-dark.svg dark \
            profile-3d-contrib/pantihen-light.svg light

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git commit -m "Update 3D contributions"; then
            git pull --rebase
            git push
          fi
